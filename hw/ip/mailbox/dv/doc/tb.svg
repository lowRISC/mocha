  Mailbox block-level DV testbench, companion to hw/ip/mailbox/dv/README.md. The origin tags
  match the verification component table in that document.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="al" markerWidth="10" markerHeight="8" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>

  <text x="500" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Mailbox block-level DV testbench</text>
  <text x="500" y="50" font-size="12" text-anchor="middle" fill="#666">Plain UVM environment, one AXI4-Lite manager agent per port</text>

  <!-- testbench outline -->
  <rect x="20" y="64" width="960" height="654" rx="10" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="36" y="84" font-size="12.5" font-weight="bold" fill="#333">tb (tb/tb.sv)</text>

  <!-- test -->
  <rect x="40" y="94" width="920" height="404" rx="8" fill="none" stroke="#b5504d" stroke-width="1.2"/>
  <text x="56" y="114" font-size="12" fill="#6d2b29"><tspan font-weight="bold">mailbox_base_test</tspan>: fills mailbox_env_cfg and starts the vseq named by +UVM_TEST_SEQ</text>
  <text x="944" y="114" font-size="10" text-anchor="end" fill="#b5504d">Build</text>

  <!-- environment -->
  <rect x="60" y="124" width="880" height="362" rx="8" fill="#fdf6f6" stroke="#b5504d"/>
  <text x="76" y="144" font-size="12" font-weight="bold" fill="#6d2b29">mailbox_env</text>
  <text x="924" y="144" font-size="10" text-anchor="end" fill="#b5504d">Build</text>

  <!-- port 0 column -->
  <rect x="80" y="156" width="240" height="56" rx="6" fill="#e2f0d9" stroke="#4e8a3e"/>
  <text x="94" y="175" font-size="12" font-weight="bold" fill="#2d5222">cfg.ral[PortMain]</text>
  <text x="94" y="191" font-size="10.5" fill="#2d5222">mailbox_reg_block</text>
  <text x="94" y="205" font-size="10.5" fill="#2d5222">base MailboxBase</text>
  <text x="306" y="175" font-size="10" text-anchor="end" fill="#4e8a3e">Generated</text>

  <rect x="140" y="232" width="180" height="52" rx="6" fill="#fbe4e4" stroke="#b5504d"/>
  <text x="152" y="250" font-size="11.5" font-weight="bold" fill="#6d2b29">m_predictor_main</text>
  <text x="152" y="265" font-size="10.5" fill="#6d2b29">drops errors, clamps</text>
  <text x="152" y="278" font-size="10.5" fill="#6d2b29">WIRQT and RIRQT</text>
  <text x="308" y="250" font-size="10" text-anchor="end" fill="#b5504d">Build</text>

  <rect x="80" y="304" width="240" height="118" rx="6" fill="#d6e4f5" stroke="#3b6ea5" stroke-dasharray="6,3"/>
  <text x="94" y="324" font-size="12" font-weight="bold" fill="#1c3d5c">m_axi_agent_main</text>
  <text x="94" y="340" font-size="10.5" fill="#1c3d5c">axi_mgr_agent</text>
  <text x="94" y="360" font-size="10.5" fill="#1c3d5c">register layering, axi_reg_adapter</text>
  <text x="94" y="376" font-size="10.5" fill="#1c3d5c">drivers, monitor, reset monitor</text>
  <text x="94" y="392" font-size="10.5" fill="#1c3d5c">single-transfer sequencer</text>
  <text x="94" y="408" font-size="10.5" fill="#1c3d5c">random delays on all channels</text>
  <text x="306" y="324" font-size="10" text-anchor="end" fill="#3b6ea5">Reuse and extend</text>

  <line x1="100" y1="212" x2="100" y2="304" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="106" y="262" font-size="9.5" fill="#555">map</text>
  <line x1="290" y1="304" x2="290" y2="284" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="290" y1="232" x2="290" y2="212" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="296" y="298" font-size="9.5" fill="#555">txn</text>
  <text x="296" y="226" font-size="9.5" fill="#555">mirror</text>

  <!-- middle column -->
  <rect x="390" y="156" width="220" height="56" rx="6" fill="#fbe4e4" stroke="#b5504d"/>
  <text x="404" y="175" font-size="12" font-weight="bold" fill="#6d2b29">m_vsqr</text>
  <text x="404" y="191" font-size="10.5" fill="#6d2b29">mailbox_virtual_sequencer</text>
  <text x="404" y="205" font-size="10.5" fill="#6d2b29">cfg and both AXI sequencers</text>
  <text x="596" y="175" font-size="10" text-anchor="end" fill="#b5504d">Build</text>

  <line x1="390" y1="184" x2="320" y2="184" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="355" y="178" font-size="9.5" text-anchor="middle" fill="#555">RAL</text>
  <line x1="610" y1="184" x2="680" y2="184" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="645" y="178" font-size="9.5" text-anchor="middle" fill="#555">RAL</text>

  <rect x="390" y="244" width="220" height="156" rx="6" fill="#fbe4e4" stroke="#b5504d"/>
  <text x="404" y="264" font-size="12" font-weight="bold" fill="#6d2b29">m_scoreboard</text>
  <text x="404" y="280" font-size="10.5" fill="#6d2b29">mailbox_scoreboard</text>
  <text x="404" y="300" font-size="10.5" fill="#6d2b29">models both FIFOs and the</text>
  <text x="404" y="314" font-size="10.5" fill="#6d2b29">registers of each port</text>
  <text x="404" y="332" font-size="10.5" fill="#6d2b29">keeps every order of accesses</text>
  <text x="404" y="346" font-size="10.5" fill="#6d2b29">that the responses allow</text>
  <text x="404" y="364" font-size="10.5" fill="#6d2b29">checks every response, every</text>
  <text x="404" y="378" font-size="10.5" fill="#6d2b29">value read and irq_o</text>
  <text x="404" y="394" font-size="10.5" fill="#6d2b29">cleared on reset</text>
  <text x="596" y="264" font-size="10" text-anchor="end" fill="#b5504d">Build</text>

  <line x1="500" y1="400" x2="500" y2="420" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="506" y="414" font-size="9.5" fill="#555">sample</text>

  <rect x="390" y="420" width="220" height="52" rx="6" fill="#fbe4e4" stroke="#b5504d"/>
  <text x="404" y="439" font-size="12" font-weight="bold" fill="#6d2b29">m_env_cov</text>
  <text x="404" y="455" font-size="10.5" fill="#6d2b29">mailbox_env_cov</text>
  <text x="404" y="467" font-size="10.5" fill="#6d2b29">built when en_cov is set</text>
  <text x="596" y="439" font-size="10" text-anchor="end" fill="#b5504d">Build</text>

  <line x1="320" y1="340" x2="390" y2="340" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="355" y="334" font-size="9.5" text-anchor="middle" fill="#555">req, txn</text>
  <line x1="320" y1="390" x2="390" y2="390" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="355" y="384" font-size="9.5" text-anchor="middle" fill="#555">reset</text>
  <line x1="680" y1="340" x2="610" y2="340" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="645" y="334" font-size="9.5" text-anchor="middle" fill="#555">req, txn</text>

  <!-- port 1 column -->
  <rect x="680" y="156" width="240" height="56" rx="6" fill="#e2f0d9" stroke="#4e8a3e"/>
  <text x="694" y="175" font-size="12" font-weight="bold" fill="#2d5222">cfg.ral[PortExt]</text>
  <text x="694" y="191" font-size="10.5" fill="#2d5222">mailbox_reg_block</text>
  <text x="694" y="205" font-size="10.5" fill="#2d5222">base MailboxExtBaseAddr</text>
  <text x="906" y="175" font-size="10" text-anchor="end" fill="#4e8a3e">Generated</text>

  <rect x="680" y="232" width="180" height="52" rx="6" fill="#fbe4e4" stroke="#b5504d"/>
  <text x="692" y="250" font-size="11.5" font-weight="bold" fill="#6d2b29">m_predictor_ext</text>
  <text x="692" y="265" font-size="10.5" fill="#6d2b29">drops errors, clamps</text>
  <text x="692" y="278" font-size="10.5" fill="#6d2b29">WIRQT and RIRQT</text>
  <text x="848" y="250" font-size="10" text-anchor="end" fill="#b5504d">Build</text>

  <rect x="680" y="304" width="240" height="118" rx="6" fill="#d6e4f5" stroke="#3b6ea5" stroke-dasharray="6,3"/>
  <text x="694" y="324" font-size="12" font-weight="bold" fill="#1c3d5c">m_axi_agent_ext</text>
  <text x="694" y="340" font-size="10.5" fill="#1c3d5c">axi_mgr_agent</text>
  <text x="694" y="360" font-size="10.5" fill="#1c3d5c">register layering, axi_reg_adapter</text>
  <text x="694" y="376" font-size="10.5" fill="#1c3d5c">drivers, monitor, reset monitor</text>
  <text x="694" y="392" font-size="10.5" fill="#1c3d5c">single-transfer sequencer</text>
  <text x="694" y="408" font-size="10.5" fill="#1c3d5c">random delays on all channels</text>
  <text x="906" y="324" font-size="10" text-anchor="end" fill="#3b6ea5">Reuse and extend</text>

  <line x1="900" y1="212" x2="900" y2="304" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="868" y="262" font-size="9.5" fill="#555">map</text>
  <line x1="710" y1="304" x2="710" y2="284" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="710" y1="232" x2="710" y2="212" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="704" y="298" font-size="9.5" text-anchor="end" fill="#555">txn</text>
  <text x="704" y="226" font-size="9.5" text-anchor="end" fill="#555">mirror</text>

  <!-- agent to interface -->
  <line x1="200" y1="422" x2="200" y2="526" stroke="#555" stroke-width="1.2" marker-start="url(#al)" marker-end="url(#ar)"/>
  <text x="206" y="516" font-size="9.5" fill="#555">vif</text>
  <line x1="800" y1="422" x2="800" y2="526" stroke="#555" stroke-width="1.2" marker-start="url(#al)" marker-end="url(#ar)"/>
  <text x="806" y="516" font-size="9.5" fill="#555">vif</text>

  <!-- interfaces -->
  <rect x="80" y="526" width="240" height="56" rx="6" fill="#d6e4f5" stroke="#3b6ea5" stroke-dasharray="6,3"/>
  <text x="94" y="545" font-size="11.5" font-weight="bold" fill="#1c3d5c">u_axi_vip_if [0]</text>
  <text x="94" y="561" font-size="10.5" fill="#1c3d5c">axi_vip_if, Manager, IsLite</text>
  <text x="94" y="575" font-size="10.5" fill="#1c3d5c">port 0, protocol SVA bound</text>
  <text x="306" y="545" font-size="10" text-anchor="end" fill="#3b6ea5">Reuse and extend</text>

  <rect x="680" y="526" width="240" height="56" rx="6" fill="#d6e4f5" stroke="#3b6ea5" stroke-dasharray="6,3"/>
  <text x="694" y="545" font-size="11.5" font-weight="bold" fill="#1c3d5c">u_axi_vip_if [1]</text>
  <text x="694" y="561" font-size="10.5" fill="#1c3d5c">axi_vip_if, Manager, IsLite</text>
  <text x="694" y="575" font-size="10.5" fill="#1c3d5c">port 1, protocol SVA bound</text>
  <text x="906" y="545" font-size="10" text-anchor="end" fill="#3b6ea5">Reuse and extend</text>

  <rect x="80" y="636" width="240" height="56" rx="6" fill="#d6e4f5" stroke="#3b6ea5"/>
  <text x="94" y="655" font-size="11.5" font-weight="bold" fill="#1c3d5c">clk_rst_if</text>
  <text x="94" y="671" font-size="10.5" fill="#1c3d5c">one clock and reset for all</text>
  <text x="94" y="685" font-size="10.5" fill="#1c3d5c">published as clk_rst_vif</text>
  <text x="306" y="655" font-size="10" text-anchor="end" fill="#3b6ea5">Reuse</text>

  <rect x="680" y="636" width="240" height="56" rx="6" fill="#d6e4f5" stroke="#3b6ea5"/>
  <text x="694" y="655" font-size="11.5" font-weight="bold" fill="#1c3d5c">intr_if</text>
  <text x="694" y="671" font-size="10.5" fill="#1c3d5c">pins_if on irq_o[1:0]</text>
  <text x="694" y="685" font-size="10.5" fill="#1c3d5c">published as intr_vif</text>
  <text x="906" y="655" font-size="10" text-anchor="end" fill="#3b6ea5">Reuse</text>

  <!-- DUT -->
  <rect x="390" y="526" width="220" height="146" rx="6" fill="#eeeeee" stroke="#555" stroke-width="1.2"/>
  <text x="404" y="545" font-size="12" font-weight="bold" fill="#222">dut: axi_lite_mailbox</text>
  <text x="404" y="561" font-size="10.5" fill="#333">MailboxDepth 3, 64-bit data</text>
  <rect x="404" y="572" width="192" height="28" rx="4" fill="#ffffff" stroke="#888"/>
  <text x="500" y="590" font-size="10" text-anchor="middle" fill="#333">FIFO 0: port 0 to port 1</text>
  <rect x="404" y="606" width="192" height="28" rx="4" fill="#ffffff" stroke="#888"/>
  <text x="500" y="624" font-size="10" text-anchor="middle" fill="#333">FIFO 1: port 1 to port 0</text>
  <text x="404" y="652" font-size="10.5" fill="#333">registers and IRQs per port</text>

  <line x1="320" y1="554" x2="390" y2="554" stroke="#555" stroke-width="1.2" marker-start="url(#al)" marker-end="url(#ar)"/>
  <text x="355" y="548" font-size="9.5" text-anchor="middle" fill="#555">port 0</text>
  <line x1="680" y1="554" x2="610" y2="554" stroke="#555" stroke-width="1.2" marker-start="url(#al)" marker-end="url(#ar)"/>
  <text x="640" y="548" font-size="9.5" text-anchor="middle" fill="#555">port 1</text>
  <line x1="320" y1="664" x2="390" y2="664" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="355" y="658" font-size="9.5" text-anchor="middle" fill="#555">clk, rst_n</text>
  <line x1="610" y1="664" x2="680" y2="664" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="645" y="658" font-size="9.5" text-anchor="middle" fill="#555">irq_o</text>

  <!-- intr_vif to scoreboard -->
  <polyline points="680,646 668,646 668,372 610,372" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="673" y="470" font-size="9.5" fill="#555">intr_vif</text>

  <!-- legend -->
  <text x="40" y="744" font-size="11" fill="#333">Origin:</text>
  <rect x="88" y="733" width="14" height="14" rx="2" fill="#fbe4e4" stroke="#b5504d"/>
  <text x="108" y="744" font-size="11" fill="#333">Build</text>
  <rect x="160" y="733" width="14" height="14" rx="2" fill="#d6e4f5" stroke="#3b6ea5"/>
  <text x="180" y="744" font-size="11" fill="#333">Reuse</text>
  <rect x="234" y="733" width="14" height="14" rx="2" fill="#d6e4f5" stroke="#3b6ea5" stroke-dasharray="3,2"/>
  <text x="254" y="744" font-size="11" fill="#333">Reuse and extend</text>
  <rect x="370" y="733" width="14" height="14" rx="2" fill="#e2f0d9" stroke="#4e8a3e"/>
  <text x="390" y="744" font-size="11" fill="#333">Generated</text>
  <rect x="466" y="733" width="14" height="14" rx="2" fill="#eeeeee" stroke="#555"/>
  <text x="486" y="744" font-size="11" fill="#333">DUT</text>
</svg>
